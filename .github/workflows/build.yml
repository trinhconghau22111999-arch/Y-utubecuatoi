name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --warning-mode all > build_output.log 2>&1
          BUILD_EXIT=$?
          echo "log-line-count: $(wc -l < build_output.log)"
          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo "BUILD FAILED with exit code $BUILD_EXIT"
            LINENO_COUNTER=0
            tail -n 60 build_output.log > tail_output.txt
            while IFS= read -r rawline; do
              LINENO_COUNTER=$((LINENO_COUNTER+1))
              safe=$(printf '%s' "$rawline" | tr -d '\r' | cut -c1-300)
              printf '::error::L%03d %s\n' "$LINENO_COUNTER" "$safe"
            done < tail_output.txt
            exit "$BUILD_EXIT"
          fi
          echo "=== APK path ==="
          find . -name "*.apk"

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Tải APK - Build #${{ github.run_number }}"
          body: "Bấm vào file bên dưới để tải APK"
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
