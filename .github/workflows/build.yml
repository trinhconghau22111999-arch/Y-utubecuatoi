name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        env:
          JAVA_OPTS: ""
          GRADLE_OPTS: ""
          JAVA_TOOL_OPTIONS: ""
          _JAVA_OPTIONS: ""
        run: |
          chmod +x gradlew
          if ./gradlew assembleDebug --stacktrace --warning-mode all > build_output.log 2>&1; then
            echo "BUILD SUCCEEDED"
            find . -name "*.apk"
          else
            echo "::error::BUILD FAILED"

            print_lines_as_errors() {
              # In từng dòng thành 1 annotation ::error:: riêng (giới hạn 300 ký tự/dòng) -
              # dùng chung cho cả 3 phần bên dưới thay vì lặp code.
              local LINENO_COUNTER=0
              while IFS= read -r rawline; do
                LINENO_COUNTER=$((LINENO_COUNTER+1))
                safe=$(printf '%s' "$rawline" | tr -d '\r' | cut -c1-300)
                printf '::error::%s\n' "$safe"
              done
            }

            # (1) TRƯỚC ĐÂY chỉ tail -n 60 toàn bộ log - với lỗi có stack trace dài, 60 dòng
            # cuối chỉ toàn là các dòng "at org.gradle...." (frame nội bộ của Gradle), còn đoạn
            # tóm tắt lỗi thật ("FAILURE: Build failed" + "* What went wrong") nằm PHÍA TRÊN thì
            # bị cắt mất, phải mở blob storage riêng của GitHub mới xem được - điều này gây khó
            # chẩn đoán lỗi ngay trong Actions. Giờ in RIÊNG đúng khối "FAILURE: Build failed"
            # trước tiên (thường chỉ vài chục dòng, đủ ngắn để không bị cắt bởi giới hạn dòng của
            # annotation).
            echo "----- FAILURE section -----"
            awk '/^FAILURE: Build failed/{found=1} found' build_output.log | head -n 60 | print_lines_as_errors

            # (2) Lỗi biên dịch Kotlin/Java thường có dạng "e: file:///path/File.kt:12:5 ..." -
            # in riêng ra nếu có, vì đây thường là dòng NGẮN GỌN chỉ thẳng vào chỗ sai, hữu ích
            # hơn nhiều so với stack trace.
            if grep -q "^e: " build_output.log; then
              echo "----- Compile errors (e: ...) -----"
              grep "^e: " build_output.log | head -n 40 | print_lines_as_errors
            fi

            # (2b) Dự phòng thêm - không phải lỗi Kotlin/Java nào cũng bắt đầu bằng "e: " đúng
            # định dạng trên (tuỳ phiên bản compiler) - in thêm nguyên khối output của TASK bị
            # fail (vd ":app:compileDebugKotlin FAILED") và mọi dòng chứa "error:" bất kể hoa
            # thường, để không bỏ sót trường hợp định dạng khác đi.
            echo "----- Task output block (nếu có) -----"
            grep -n -i -A 25 "^> Task .*FAILED" build_output.log | head -n 80 | print_lines_as_errors
            echo "----- Any line containing 'error:' -----"
            grep -n -i "error:" build_output.log | head -n 40 | print_lines_as_errors

            # (3) Vẫn giữ tail cuối log như cũ để phòng trường hợp lỗi không rơi vào 2 dạng trên
            # (lỗi không phải do Gradle/Kotlin, vd tải dependency thất bại...).
            echo "----- Tail of log -----"
            tail -n 40 build_output.log | print_lines_as_errors

            exit 1
          fi

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Tải APK - Build #${{ github.run_number }}"
          body: "Bấm vào file bên dưới để tải APK"
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
