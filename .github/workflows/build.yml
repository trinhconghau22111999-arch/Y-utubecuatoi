name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: |
          echo "::error::MARKER_BEFORE_GRADLE"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --warning-mode all > build_output.log 2>&1
          BUILD_EXIT=$?
          echo "::error::MARKER_AFTER_GRADLE exit=$BUILD_EXIT lines=$(wc -l < build_output.log)"
          echo "::error::LAST_LINE: $(tail -n 1 build_output.log)"
          exit 1
