name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug 2>&1 | tee build_output.txt
          exit ${PIPESTATUS[0]}

      - name: Show errors if failed
        if: failure()
        run: |
          echo "=== BUILD ERRORS ==="
          grep -E "error:|Error:|FAILED|Exception|Unresolved|cannot find" build_output.txt | head -50 || cat build_output.txt | tail -80

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
